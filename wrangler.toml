name = "bimayantra-frontend-skyup"
compatibility_date = "2026-11-07"
main = "worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Send API calls to the Worker (proxy) instead of the SPA fallback
run_worker_first = ["/v1/*"]

[vars]
# Origin of the bimayantra-api / insurehub-backend server (no trailing slash, no /v1)
API_ORIGIN = "https://api.your-backend-domain.com"
